# Local development stack. Copy .env.example to .env first.
#   docker compose up --build
# Open http://localhost:8080 — nginx serves the SPA and proxies /api to the API (same origin).
name: helpdesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    build: ./backend
    command: ['node', 'src/db/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helpdesk}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helpdesk}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      # Browsers send Origin http://localhost:8080 (the web container) on refresh/logout.
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # nginx (web) sits in front of the API.
      TRUST_PROXY_HOPS: 1
    # Not published to the host: the API is reached through the web container only,
    # mirroring the internal-only ingress used on Azure.
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
