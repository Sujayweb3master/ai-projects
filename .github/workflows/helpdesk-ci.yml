# CI for helpdesk-app/ only. concept-lab/ and other folders never trigger this workflow.
name: helpdesk-ci

on:
  push:
    branches: [main, 'feat/helpdesk-app']
    paths:
      - 'helpdesk-app/**'
      - '.github/workflows/helpdesk-ci.yml'
  pull_request:
    paths:
      - 'helpdesk-app/**'
      - '.github/workflows/helpdesk-ci.yml'

permissions:
  contents: read

concurrency:
  group: helpdesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: helpdesk-app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-app/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the ephemeral CI database container; not a secret.
      DATABASE_URL_TEST: postgres://helpdesk:ci-only-password@localhost:5432/helpdesk_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: helpdesk-app/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: helpdesk-app/backend
          push: false
          tags: helpdesk-api:ci-${{ github.sha }}
          cache-from: type=gha,scope=helpdesk-api
          cache-to: type=gha,mode=max,scope=helpdesk-api
